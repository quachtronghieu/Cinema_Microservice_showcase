server.port=8081
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Cinema_Management1;encrypt=false;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=true
# Disable template cache for development
spring.thymeleaf.cache=false 
# Enable hot reload
spring.devtools.restart.enabled=true  
# Exclude static resources from restart
spring.devtools.restart.exclude=static/**,public/**  
# LiveReload
spring.devtools.livereload.enabled=true

spring.mail.host=smtp.gmail.com 
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# spring.mail.test-connection=false

# Secrets come from env vars or the git-ignored application-local.properties
spring.config.import=optional:classpath:application-local.properties
