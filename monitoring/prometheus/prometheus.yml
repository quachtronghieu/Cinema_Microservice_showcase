global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Infrastructure: Service Discovery (Eureka)
  - job_name: 'discovery-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']
        labels:
          application: 'discovery-server'
          service: 'infrastructure'

  # Infrastructure: API Gateway
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          application: 'api-gateway'
          service: 'infrastructure'

  # Business Service: Identity Service (Auth / Users / RBAC)
  - job_name: 'identity-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'identity-service'
          service: 'identity'

  # Business Service: Catalog Service (Movies / Concessions / Watchlist)
  - job_name: 'catalog-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'catalog-service'
          service: 'catalog'

  # Business Service: Booking Service (Inventory / Hold / Payment / Tickets)
  - job_name: 'booking-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'booking-service'
          service: 'booking'

  # Business Service: Cinema Service (Showtimes / Rooms / Physical Seats)
  - job_name: 'cinema-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          application: 'cinema-service'
          service: 'cinema'
