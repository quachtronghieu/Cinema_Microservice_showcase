server:
  port: 8083
spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate.jdbc.time_zone: UTC
      # Instants are stored as UTC DATETIME2 (AGENTS 24), not Hibernate 6's default DATETIMEOFFSET.
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    url: ${BOOKING_MIGRATION_URL:${BOOKING_DB_URL}}
    user: ${BOOKING_MIGRATION_USERNAME}
    password: ${BOOKING_MIGRATION_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        # 404 means "item not sold", not an unhealthy catalog.
        ignore-exceptions:
          - feign.FeignException$NotFound
  timelimiter:
    configs:
      default:
        timeout-duration: 4s
booking:
  # Demo payment simulator (no real bank). Off unless explicitly enabled (AGENTS 5.3).
  demo-payment:
    enabled: ${BOOKING_DEMO_PAYMENT_ENABLED:false}
  security:
    issuer: ${JWT_ISSUER:cinema-identity}
    jwk-set-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    audience: cinema-api
    # Service tokens (token_kind=service) issued by identity for this service.
    service-audience: ${spring.application.name}
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  # The Grafana dashboard groups every panel by this label.
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
      export:
        enabled: ${TRACING_EXPORT_ENABLED:false}
