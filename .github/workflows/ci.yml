name: Cinema Microservices CI/CD

# CI: builds and tests everything on the branches below and on every PR into main/develop.
# CD: after CI passes on main, each runnable app is published as a Docker image to GitHub Container Registry.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# A newer push to the same branch cancels the older run, except on main so an image publish is never cut off.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # 1. BACKEND: build, unit tests and integration tests (Java 21, Spring Boot 3.5.4)
  # ===========================================================================
  backend:
    name: Backend build & test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # verify = compile + unit tests (surefire, *Test) + integration tests (failsafe, *IT).
      # The runner has Docker, so the ITs start a real SQL Server 2022 through Testcontainers;
      # seat/payment invariants are checked against real locks and constraints (AGENTS 12).
      - name: Build and run unit + integration tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ===========================================================================
  # 2. MOBILE: static analysis and tests (Flutter, cinema_booking_app)
  # ===========================================================================
  mobile:
    name: Mobile analyze & test (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: cinema_booking_app

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Flutter (same version the team uses locally)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test

  # ===========================================================================
  # 3. CD: publish Docker images to ghcr.io (only after CI passes on main)
  # ===========================================================================
  docker:
    name: Publish image (${{ matrix.app }})
    needs: [backend, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: discovery-server
            dockerfile: infrastructure/discovery-server/Dockerfile
          - app: api-gateway
            dockerfile: infrastructure/api-gateway/Dockerfile
          - app: identity-service
            dockerfile: services/identity-service/Dockerfile
          - app: catalog-service
            dockerfile: services/catalog-service/Dockerfile
          - app: cinema-service
            dockerfile: services/cinema-service/Dockerfile
          - app: booking-service
            dockerfile: services/booking-service/Dockerfile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ghcr.io only accepts lowercase names; the owner is TuongVy-dev.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cinema-${{ matrix.app }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
